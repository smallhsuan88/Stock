<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signals TW Dashboard (MVP)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial; margin: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
    th { cursor: pointer; position: sticky; top: 0; background: #f7f7f7; }
    tr.breakout { background: #fff4cc; }
    .meta { color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="meta" id="meta"></div>
  <table id="tbl"></table>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR0jZGDcs7RBtAIDCjvT4ficZrXwK_lTZTIkxKQHJo8kt9Rh9f9agTXoOzkn5zBa10xNwsj0YkhNfyg/pub?gid=1518299280&single=true&output=csv"; // 例如 .../pub?gid=xxx&single=true&output=csv
let rows = [];
let headers = [];
let sortKey = null;
let sortAsc = false;

function parseCSV(text) {
  // MVP 簡化版：假設沒有欄位內逗號/引號
  return text.trim().split("\n").map(line => line.split(","));
}

function toVal(x) {
  const n = Number(x);
  return Number.isFinite(n) ? n : x;
}

function render() {
  const tbl = document.getElementById("tbl");
  tbl.innerHTML = "";

  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h, idx) => {
    const th = document.createElement("th");
    th.textContent = h;
    th.onclick = () => {
      sortKey = idx;
      sortAsc = !sortAsc;
      sortRows();
      render();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  tbl.appendChild(thead);

  const tbody = document.createElement("tbody");
  rows.forEach(r => {
    const tr = document.createElement("tr");
    const breakoutIdx = headers.indexOf("breakout");
    if (breakoutIdx >= 0 && String(r[breakoutIdx]).toUpperCase() === "TRUE") tr.className = "breakout";
    r.forEach(c => {
      const td = document.createElement("td");
      td.textContent = c;
      tbody.appendChild(tr).appendChild(td);
    });
  });
  tbl.appendChild(tbody);
}

function sortRows() {
  // 先讓 breakout=TRUE 置頂
  const bIdx = headers.indexOf("breakout");
  rows.sort((a,b) => {
    const ab = (bIdx>=0 && String(a[bIdx]).toUpperCase()==="TRUE") ? 1 : 0;
    const bb = (bIdx>=0 && String(b[bIdx]).toUpperCase()==="TRUE") ? 1 : 0;
    if (ab !== bb) return bb - ab;

    if (sortKey === null) return 0;
    const va = toVal(a[sortKey]);
    const vb = toVal(b[sortKey]);
    if (typeof va === "number" && typeof vb === "number") return sortAsc ? va - vb : vb - va;
    return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
}

(async function init(){
  const res = await fetch(CSV_URL, { cache: "no-store" });
  const text = await res.text();
  const data = parseCSV(text);
  headers = data[0];
  rows = data.slice(1);
  sortRows();
  document.getElementById("meta").textContent = `Rows: ${rows.length} ｜ Click header to sort ｜ Breakout highlighted`;
  render();
})();
</script>
</body>
</html>
